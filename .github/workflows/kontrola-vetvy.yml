name: Kontrola vetvy (bez vydania)
on:
  push:
    branches-ignore: [main]
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Moduly pre postavičku
        shell: bash
        run: |
          ls node_modules/three/build/three.module.js node_modules/three/examples/jsm/loaders/GLTFLoader.js node_modules/@pixiv/three-vrm/lib/three-vrm.module.js
          ls node_modules/@node-llama-cpp/ || true
          node --check src/main.js && node --check src/postava/main.js && node --check src/postava/render.js
      - name: Zostavenie (bez inštalátora)
        run: npx electron-builder --win --dir --publish never
      - shell: bash
        run: du -sh dist/win-unpacked; ls dist/win-unpacked/resources; ls dist/win-unpacked/resources/app.asar.unpacked/node_modules
      - name: Test postavičky (snímka)
        shell: pwsh
        run: |
          $env:POSTAVA_TEST = "$PWD\postava.png"
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 90
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content out.txt -ErrorAction SilentlyContinue | Select-String "postava" | Select-Object -First 60
          Get-Content err.txt -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (Test-Path postava.png) { "SNIMKA OK $((Get-Item postava.png).Length)" } else { "SNIMKA CHYBA" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postava-snimka
          path: desktop/postava.png
          if-no-files-found: ignore
