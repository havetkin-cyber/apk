name: dočasné – Kasandra
on:
  push:
    branches: [postava]
    paths: ['.github/workflows/kasandra-test.yml']
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          for r in refs%2Fpr%2F93 refs%2Fpr%2F98 main; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/rhasspy/piper-voices/tree/$r/cs/cs_CZ?recursive=true" | jq -r '.[] | "\(.size) \(.path)"' | grep -i kasandra
          done
          curl -s https://api.github.com/repos/rhasspy/piper/releases/latest | jq -r '.tag_name, (.assets[].browser_download_url)' | grep -i "windows\|^20"
          curl -sIL -o /dev/null -w "qwen3 %{http_code}\n" https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
